# bank-security's application.yml file
spring:
  config:
    import: optional:configserver:http://localhost:8888
    additional-location: classpath:/configurations/bank-common.yml
  application:
    name: bank-security
  main:
    web-application-type: reactive

logging:
  level:
    web: info
    root: info
    sql: debug
    org:
      springframework:
        web:
          client: info
          reactive:
            function:
              client:
                ExchangeFunction: trace
              _: info
            _: info
          _: debug
        _: info
        security:
          core: debug
          web: debug
        data:
          r2dbc:
            core: info
          _: info
        r2dbc: info
    reactor:
      netty:
        http:
          server: info
          client: info
      _: debug
    io:
      r2dbc:
        postgresql:
          QUERY: info
        spi: info
    am:
      banking:
        system:
          user: debug
          security: debug
          notification: debug